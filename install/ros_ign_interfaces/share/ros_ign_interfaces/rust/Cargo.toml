[package]
name = "ros_ign_interfaces"
version = "0.244.20"
edition = "2021"

[dependencies]
rosidl_runtime_rs = "0.6"
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

# ROS Dependencies
rcl_interfaces = "*"
builtin_interfaces = "*"
std_msgs = "*"
geometry_msgs = "*"
ros_gz_interfaces = "*"

[features]
serde = ['dep:serde', 'dep:serde-big-array', 'rosidl_runtime_rs/serde', 'rcl_interfaces/serde', 'builtin_interfaces/serde', 'std_msgs/serde', 'geometry_msgs/serde', 'ros_gz_interfaces/serde']

[package.metadata.rclrs]
reexport = true
