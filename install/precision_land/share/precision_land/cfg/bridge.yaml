# bridge.yaml — gz ↔ ROS 2 topic bridges (Gazebo Harmonic / PX4 simulation)
# This bridge now links gz-msgs10 + gz-transport13 (Harmonic native).

- ros_topic_name: "/world/default/model/x500_mono_cam_down_1/link/camera_link/sensor/imager/image"
  gz_topic_name: "/world/default/model/x500_mono_cam_down_1/link/camera_link/sensor/imager/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  subscriber_queue: 5
  publisher_queue: 5
  lazy: false

- ros_topic_name: "/world/default/model/x500_mono_cam_down_1/link/camera_link/sensor/imager/camera_info"
  gz_topic_name: "/world/default/model/x500_mono_cam_down_1/link/camera_link/sensor/imager/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  subscriber_queue: 5
  publisher_queue: 5
  lazy: false

- ros_topic_name: "/image_proc"
  gz_topic_name: "/image_proc"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: ROS_TO_GZ
  subscriber_queue: 5
  publisher_queue: 5
  lazy: true
